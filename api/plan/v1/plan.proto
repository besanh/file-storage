syntax = "proto3";

package api.plan.v1;

option go_package = "file/api/plan/v1;v1";

import "google/api/annotations.proto";

// =====================================================================
// PLAN SERVICE
// =====================================================================
service PlanService {
    rpc GetPlan (GetPlanRequest) returns (GetPlanReply) {
        option (google.api.http) = {
            get: "/v1/plans/{id}"
        };
    }

    rpc ListPlans (ListPlansRequest) returns (ListPlansReply) {
        option (google.api.http) = {
            get: "/v1/plans"
        };
    }

    rpc CreatePlan (CreatePlanRequest) returns (CreatePlanReply) {
        option (google.api.http) = {
            post: "/v1/plans"
            body: "*"
        };
    }

    rpc UpdatePlan (UpdatePlanRequest) returns (UpdatePlanReply) {
        option (google.api.http) = {
            patch: "/v1/plans/{id}"
            body: "*"
        };
    }

    rpc DeletePlan (DeletePlanRequest) returns (DeletePlanReply) {
        option (google.api.http) = {
            delete: "/v1/plans/{id}"
        };
    }
}

// =====================================================================
// MESSAGES
// =====================================================================

message Plan {
    string id = 1;
    string name = 2;
    int64 storage_quota = 3;
    int64 price = 4;
    int64 discount_price = 5;
    int32 duration_days = 6;
    string description = 7;
    string created_at = 8;
    string updated_at = 9;
}

message GetPlanRequest {
    string id = 1;
}

message GetPlanReply {
    Plan plan = 1;
}

message ListPlansRequest {}

message ListPlansReply {
    repeated Plan plans = 1;
}

message CreatePlanRequest {
    string name = 1;
    int64 storage_quota = 2;
    int64 price = 3;
    int64 discount_price = 4;
    int32 duration_days = 5;
    string description = 6;
}

message CreatePlanReply {
    Plan plan = 1;
}

message UpdatePlanRequest {
    string id = 1;
    string name = 2;
    int64 storage_quota = 3;
    int64 price = 4;
    int64 discount_price = 5;
    int32 duration_days = 6;
    string description = 7;
}

message UpdatePlanReply {
    Plan plan = 1;
}

message DeletePlanRequest {
    string id = 1;
}

message DeletePlanReply {
    bool success = 1;
}
