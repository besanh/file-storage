syntax = "proto3";

package user.v1;

option go_package = "file/api/user/v1;v1";

import "google/api/annotations.proto";

service UserService {
    rpc GetUser (GetUserRequest) returns (GetUserReply) {
        option (google.api.http) = {
            get: "/v1/user"
        };
    }
}

message GetUserRequest {
    string user_id = 1;
}

message GetUserReply {
    string user_id = 1;
    string email = 2;
    string role = 3;
    string scope = 4;
    string status = 5;
    string created_at = 6;
}
